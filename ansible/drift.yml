- name: Sette opp drift, sikkerhet og backup på Filserver
  hosts: file
  become: true

  tasks:
    - name: Tillat SSH 
      ufw:
        rule: allow
        name: OpenSSH

    - name: Tillat Samba (Fildeling)
      ufw:
        rule: allow
        name: Samba

    - name: Aktiver brannmur og nekt alt annet
      ufw:
        state: enabled
        policy: deny
        logging: on

    - name: Lag mappe for backup
      file:
        path: /var/backups/skole
        state: directory
        mode: '0700' 

    - name: Lag backup-script
      copy:
        dest: /usr/local/bin/ta_backup.sh
        mode: '0755'
        content: |
          #!/bin/bash
          # Enkelt script
          TIMESTAMP=$(date +"%Y-%m-%d")
          BACKUP_DIR="/var/backups/skole"
          SOURCE="/skole-data"
          # Tar backup og komprimerer med gzip
          tar -czf "$BACKUP_DIR/backup-$TIMESTAMP.tar.gz" "$SOURCE"
          # Slett backuper eldre enn 7 dager
          find "$BACKUP_DIR" -type f -mtime +7 -delete

    - name: Legg backup inn i CRON jobb (Kjøres hver natt kl 03:00)
      cron:
        name: "Daglig backup av skole-data"
        minute: "0"
        hour: "3"
        job: "/usr/local/bin/ta_backup.sh"
        
    - name: Lag overvåknings-script
      copy:
        dest: /usr/local/bin/sjekk_disk.sh
        mode: '0755'
        content: |
          #!/bin/bash
          # Sjekker om diskbruken er over 90%
          DISK_BRUK=$(df / | grep / | awk '{ print $5 }' | sed 's/%//g')
          if [ "$DISK_BRUK" -gt 90 ]; then
              echo "ADVARSEL: Lite diskplass på serveren! Bruk: $DISK_BRUK%" >> /var/log/syslog
          fi

    - name: Kjør disksjekk hver time
      cron:
        name: "Sjekk diskplass"
        minute: "0"
        job: "/usr/local/bin/sjekk_disk.sh"
